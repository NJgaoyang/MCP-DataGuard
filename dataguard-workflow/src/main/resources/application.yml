server:
  address: ${FLOWABLE_BIND_ADDRESS:127.0.0.1}
  port: ${FLOWABLE_PORT:8083}
spring:
  application:
    name: dataguard-workflow
  datasource:
    url: ${FLOWABLE_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/dataguard?currentSchema=flowable}
    username: ${PG_FLOWABLE_USER:dg_flowable}
    password: ${PG_FLOWABLE_PASSWORD:}
flowable:
  database-schema: flowable
  database-schema-update: ${FLOWABLE_SCHEMA_UPDATE:false}
  async-executor-activate: false
management:
  endpoints:
    web:
      exposure:
        include: health,info

dataguard:
  workflow:
    dynamic-deployment:
      enabled: ${FLOWABLE_DYNAMIC_DEPLOYMENT_ENABLED:false}
    outbox:
      enabled: ${FLOWABLE_OUTBOX_ENABLED:false}
      jdbc-url: ${PLATFORM_JDBC_URL:}
      user: ${PG_PLATFORM_USER:}
      password: ${PG_PLATFORM_PASSWORD:}
      poll-ms: ${FLOWABLE_OUTBOX_POLL_MS:10000}
