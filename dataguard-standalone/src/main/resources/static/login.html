<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataGuard · 登录</title>
<style>body{margin:0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#f6f8fb;color:#172b4d;display:grid;min-height:100vh;place-items:center}.panel{width:min(390px,calc(100vw - 54px));background:white;padding:38px;border:1px solid #e6eaf0;border-radius:20px;box-shadow:0 20px 70px #102e4d12}.logo{font-size:24px;font-weight:750;letter-spacing:-.7px;color:#1869d8}.sub{color:#8490a6;font-size:13px;margin:10px 0 30px}label{display:block;margin:20px 0 6px;font-size:13px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #dce3ef;font-size:15px;box-sizing:border-box}button{width:100%;border:0;background:#1677ff;color:white;padding:13px;border-radius:10px;margin-top:25px;font-weight:650;font-size:15px;cursor:pointer}.error{color:#c21e33;font-size:13px;margin-top:10px}</style></head><body><main class="panel"><div class="logo">DataGuard</div><div class="sub">企业内部数据安全控制平台</div><form action="/auth/login" method="post"><input type="hidden" name="_csrf" id="csrf"><label>用户名</label><input name="username" autocomplete="username" required placeholder="请输入用户名"><label>密码</label><input type="password" name="password" autocomplete="current-password" required placeholder="请输入密码"><button>登录</button></form><div class="error" id="error"></div></main><script>fetch('/api/csrf',{credentials:'same-origin'}).then(r=>r.json()).then(x=>{document.getElementById('csrf').value=x.token});if(location.search.includes('error'))document.getElementById('error').textContent='用户名或密码错误，或账户暂时锁定';</script></body></html>
