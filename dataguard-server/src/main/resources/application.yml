server:
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  port: ${GATEWAY_PORT:8080}
spring:
  application:
    name: dataguard-server
  datasource:
    url: ${PLATFORM_JDBC_URL:jdbc:postgresql://127.0.0.1:55432/dataguard?currentSchema=platform}
    username: ${PG_PLATFORM_USER:dg_platform}
    password: ${PG_PLATFORM_PASSWORD:}
  flyway:
    enabled: true
    default-schema: platform
    schemas: platform
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: mcp-dataguard
        version: 0.5.0
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
dataguard:
  write:
    queue:
      enabled: ${DG_WRITE_QUEUE_ENABLED:false}
    execution:
      enabled: ${DG_ENABLE_WRITE_EXECUTION:false}
      poll-ms: ${DG_WRITE_POLL_MS:15000}
    recovery:
      enabled: ${DG_WRITE_RECOVERY_ENABLED:false}
      poll-ms: ${DG_WRITE_RECOVERY_POLL_MS:30000}
    allowed-hosts: ${DG_WRITE_ALLOWED_HOSTS:}
  security:
    mode: native
  connection-test:
    allowed-hosts: ${DG_CONNECT_TEST_ALLOW_HOSTS:}
  readonly:
    allowed-hosts: ${DG_CONNECT_TEST_ALLOW_HOSTS:}
  sql:
    allow-read-execution: ${DG_ENABLE_READ_EXECUTION:false}
    max-rows: 100
    query-timeout-seconds: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info
