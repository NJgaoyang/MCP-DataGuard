name: Backend and contract checks
on:
  push:
    branches: [dev20261022]
  pull_request: {}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - name: Flyway migration must match reviewed baseline
        run: cmp -s database/postgresql/V1__platform_baseline.sql dataguard-server/src/main/resources/db/migration/V1__platform_baseline.sql
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool contracts/mcp/mcp-tools-v1.json >/dev/null
      - run: python3 -m py_compile bin/bootstrap-admin.py
      - run: python3 -m unittest discover -s tests -p 'test_bootstrap_*.py'
      - run: python3 -c "import re,pathlib; s=pathlib.Path('database/postgresql/V1__platform_baseline.sql').read_text(); assert len(re.findall(r'^CREATE TABLE ',s,re.M)) == 44"


  postgres-ddl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: dataguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dataguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Execute all 44 tables on PostgreSQL 17
        run: |
          docker run --rm --network host -v "$PWD":/work -w /work postgres:17 sh -ec '
            export PGPASSWORD=ci_only_password
            psql -h 127.0.0.1 -U postgres -d dataguard -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE dg_platform LOGIN PASSWORD '\''platform_ci_password'\''; CREATE SCHEMA platform AUTHORIZATION dg_platform;"
            PGPASSWORD=platform_ci_password psql -h 127.0.0.1 -U dg_platform -d dataguard \
              -v ON_ERROR_STOP=1 -f database/postgresql/V1__platform_baseline.sql
            total=$(psql -h 127.0.0.1 -U postgres -d dataguard -At \
              -c "SELECT count(*) FROM pg_tables WHERE schemaname='\''platform'\'' AND tablename LIKE '\''dg_%'\''")
            echo "Platform tables: $total"
            test "$total" = 44

            psql -h 127.0.0.1 -U postgres -d dataguard -v ON_ERROR_STOP=1 -c \
              "INSERT INTO platform.dg_organization(id,code,name) VALUES ('\''11111111-1111-4111-8111-111111111111'\'','\''ci_org'\'','\''CI org'\'');"
            psql -h 127.0.0.1 -U postgres -d dataguard -v ON_ERROR_STOP=1 -c \
              "INSERT INTO platform.dg_role(id,org_id,code,name,system_role,permissions) VALUES ('\''22222222-2222-4222-8222-222222222222'\'','\''11111111-1111-4111-8111-111111111111'\'','\''org-admin'\'','\''Bootstrap Administrator'\'',true,'\''[]'\''::jsonb);"
            PGOPTIONS='-c search_path=platform' PGPASSWORD=platform_ci_password psql -h 127.0.0.1 -U dg_platform -d dataguard \
              -v ON_ERROR_STOP=1 -f dataguard-server/src/main/resources/db/migration/V2__identity_administration.sql
            added=$(psql -h 127.0.0.1 -U postgres -d dataguard -At -c \
              "SELECT permissions @> '\''[\"identity:admin\"]'\''::jsonb FROM platform.dg_role WHERE code='\''org-admin'\''")
            test "$added" = t
          '


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataguard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install front-end dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Vue TypeScript and build
        run: npm run build


  deployment-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify development Compose configuration
        run: docker compose --env-file deploy/.env.dev.example -f deploy/compose.yaml -f deploy/compose.dev.yaml config --quiet
      - name: Validate shell syntax
        run: bash -n bin/check-dev-deploy.sh bin/start-dev-deploy.sh deploy/postgres/init/01-init.sh
      - name: Validate optional public HTTPS overlay
        run: docker compose --env-file deploy/.env.dev.example --env-file deploy/.env.public.example -f deploy/compose.yaml -f deploy/compose.dev.yaml -f deploy/compose.public.yaml config --quiet
      - name: Validate branded Keycloak login theme and compose overlay
        run: |
          test -s deploy/keycloak/themes/dataguard/login/theme.properties
          test -s deploy/keycloak/themes/dataguard/login/resources/css/dataguard.css
          test -s deploy/keycloak/themes/dataguard/login/resources/css/dataguard-layout-v2.css
          grep -q 'dataguard-layout-v2.css' deploy/keycloak/themes/dataguard/login/theme.properties
          grep -q 'parent=keycloak.v2' deploy/keycloak/themes/dataguard/login/theme.properties
          docker compose --env-file deploy/.env.dev.example --env-file deploy/.env.idp.example --env-file deploy/.env.public.example -f deploy/compose.yaml -f deploy/compose.dev.yaml -f deploy/compose.identity.yaml -f deploy/compose.public.yaml config --quiet
      - name: Check public deployment script syntax
        run: bash -n bin/start-public-test.sh
      - name: Protect secrets from Docker build context
        run: |
          grep -q '**/.env.*' .dockerignore
          grep -q '**/*.pem' .dockerignore
