name: Production hardening checks
on:
  push:
    branches: [dev20261022]
    paths:
      - 'deploy/compose.hardened.yaml'
      - 'deploy/Caddyfile.public'
      - 'bin/backup-postgres-encrypted.sh'
      - 'bin/verify-encrypted-backup-restore.sh'
      - 'bin/verify-hardened-compose.sh'
      - 'bin/verify-real-postgres-commit-disconnect.sh'
      - 'bin/verify-isolated-worker-sigkill.sh'
      - 'bin/verify-signed-production-release.sh'
      - 'bin/verify-signed-release-policy.sh'
      - 'bin/check-production-readiness.sh'
      - 'bin/verify-local-backup-health.py'
      - 'bin/verify-local-backup-health-policy.py'
      - 'bin/prune-local-encrypted-backups.py'
      - 'bin/verify-local-backup-retention-policy.py'
      - 'bin/notify-operational-incidents.py'
      - 'bin/verify-operational-alert-policy.py'
      - 'bin/verify-operational-alert-https-e2e.py'
      - 'deploy/systemd/dataguard-backup-health.service'
      - 'deploy/systemd/dataguard-backup-health.timer'
      - 'deploy/systemd/dataguard-operations-alert.service'
      - 'deploy/systemd/dataguard-operations-alert.timer'
      - '.github/workflows/production-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hardened Docker compose and scripts
        run: bash bin/verify-hardened-compose.sh
      - name: Validate Caddy HTTPS ingress config
        run: |
          docker run --rm --network none \
            -e DG_PUBLIC_HOST=example.com \
            -v "$PWD/deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

  encrypted-backup-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable test-only encryption identity
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/backups"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          gpg --batch --passphrase '' --quick-generate-key \
            'Disposable CI Backup <ci@example.invalid>' rsa3072 encr 1d
          FPR=$(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr" {print $10;exit}')
          echo "DG_BACKUP_RECIPIENT=$FPR" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL with synthetic schema
        run: |
          set -euo pipefail
          docker pull postgres:17
          docker run --rm -d --name dg-ci-backup-source --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=dataguard postgres:17
          ready=0
          for i in $(seq 1 60); do
            if docker exec -u postgres dg-ci-backup-source psql -U postgres -d dataguard \
              -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs --tail 25 dg-ci-backup-source >&2 || true
            exit 1
          fi
          docker exec -i -u postgres dg-ci-backup-source psql -U postgres \
            -d dataguard -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA platform;
          CREATE TABLE platform.dg_sql_approval(id uuid PRIMARY KEY);
          CREATE TABLE platform.dg_audit_event(id uuid PRIMARY KEY);
          CREATE TABLE platform.dg_execution_task(id uuid PRIMARY KEY);
          CREATE TABLE platform.dg_alert_event(id uuid PRIMARY KEY);
          INSERT INTO platform.dg_audit_event VALUES ('11111111-1111-4111-8111-111111111111');
          SQL
      - name: Encrypted backup and offline restore
        run: |
          set -euo pipefail
          export DG_BACKUP_CONTAINER=dg-ci-backup-source
          export DG_BACKUP_DB_USER=postgres
          export DG_BACKUP_DIRECTORY="$RUNNER_TEMP/backups"
          bash bin/backup-postgres-encrypted.sh
          export DG_RESTORE_VERIFY_ARCHIVE
          DG_RESTORE_VERIFY_ARCHIVE=$(find "$DG_BACKUP_DIRECTORY" -maxdepth 1 -name '*.dump.gpg' -print -quit)
          test -n "$DG_RESTORE_VERIFY_ARCHIVE"
          bash bin/verify-encrypted-backup-restore.sh
          echo "ENCRYPTED_BACKUP_AND_OFFLINE_RESTORE_PASS"
      - name: Destroy disposable source
        if: always()
        run: docker rm -f dg-ci-backup-source >/dev/null 2>&1 || true

  real-tcp-commit-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inject real TCP failures around PostgreSQL COMMIT
        run: |
          set -euo pipefail
          docker pull postgres:17
          bash bin/verify-real-postgres-commit-disconnect.sh
          echo "REAL_TCP_BEFORE_AFTER_COMMIT_GATE_PASS"

  signed-release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify 3 independent cryptographic production approvals
        run: |
          set -euo pipefail
          bash bin/verify-signed-release-policy.sh

  local-backup-and-alert-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify local backups, safe retention and operational alerts
        run: |
          set -euo pipefail
          python3 bin/verify-local-backup-health-policy.py
          python3 bin/verify-local-backup-retention-policy.py
          python3 bin/verify-operational-alert-policy.py
          python3 bin/verify-operational-alert-https-e2e.py
          bash -n bin/check-production-readiness.sh
          EVIDENCE_DIR=$(mktemp -d)
          chmod 700 "$EVIDENCE_DIR"
          if DG_READINESS_EVIDENCE_DIR="$EVIDENCE_DIR" bash bin/check-production-readiness.sh; then
            echo "FAIL: missing release evidence incorrectly authorized launch" >&2
            exit 1
          fi
          rm -r "$EVIDENCE_DIR"
          echo "PRODUCTION_EMPTY_EVIDENCE_NO_GO_PASS"

  worker-client-sigkill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Kill isolated SQL client after durable PostgreSQL commit
        run: |
          set -euo pipefail
          docker pull postgres:17
          bash bin/verify-isolated-worker-sigkill.sh
