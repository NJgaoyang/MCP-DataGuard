name: V2 real StarRocks Docker lab
on:
  workflow_dispatch:
  push:
    branches: [refactor/dataguard-v2]
    paths:
      - '.github/workflows/v2-starrocks-lab.yml'
      - 'dataguard-standalone/src/test/java/io/github/mcpdataguard/standalone/StarRocksLiveJdbcTest.java'
      - 'dataguard-standalone/src/main/java/io/github/mcpdataguard/standalone/StarRocksReadGrantPolicy.java'
      - 'dataguard-standalone/src/main/java/io/github/mcpdataguard/standalone/ReadDatasourceDialect.java'
permissions:
  contents: read
concurrency:
  group: v2-starrocks-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-starrocks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Free ephemeral runner disk for StarRocks BE
        run: |
          set -euo pipefail
          # Disposable GitHub-hosted VM only, NEVER a development or production host.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Start isolated StarRocks 3.5.21 FE and BE
        run: |
          set -euo pipefail
          docker run -d --name dg-v2-starrocks-ci --restart no \
            -p 127.0.0.1:9030:9030 \
            starrocks/allin1-ubuntu:3.5.21
          ready=false
          for i in $(seq 1 120);do
            if docker exec dg-v2-starrocks-ci mysql -h 127.0.0.1 -P 9030 -uroot \
                -N -e 'SELECT 1' 2>/dev/null | grep -qx 1;then
              ready=true;break
            fi
            sleep 3
          done
          if [[ "$ready" != true ]];then
            docker logs --tail 50 dg-v2-starrocks-ci
            exit 1
          fi
      - name: Wait for backend capacity
        run: |
          set -euo pipefail
          for i in $(seq 1 100);do
            state="$(docker exec dg-v2-starrocks-ci mysql -h 127.0.0.1 -P 9030 -uroot -N -e 'SHOW BACKENDS' 2>/dev/null || true)"
            if [[ "$state" == *"true"* && "$state" != *"false"* ]];then
              echo STARROCKS_BACKEND_READY
              exit 0
            fi
            sleep 2
          done
          docker exec dg-v2-starrocks-ci mysql -h 127.0.0.1 -P 9030 -uroot -e 'SHOW BACKENDS' || true
          echo 'StarRocks BE not healthy (check disk availability)' >&2
          exit 1
      - name: Create table and least-privilege user on REAL StarRocks
        run: |
          set -euo pipefail
          docker exec -i dg-v2-starrocks-ci mysql -h 127.0.0.1 -P 9030 -uroot <<'SQL'
          CREATE DATABASE IF NOT EXISTS dg_lab;
          CREATE TABLE IF NOT EXISTS dg_lab.lab_orders (
            order_id INT NOT NULL,
            amount INT NOT NULL
          ) ENGINE=OLAP
          DUPLICATE KEY(order_id)
          DISTRIBUTED BY HASH(order_id) BUCKETS 1
          PROPERTIES ("replication_num" = "1");
          INSERT INTO dg_lab.lab_orders VALUES(1,17),(2,23);
          CREATE USER 'dg_ro'@'%' IDENTIFIED BY 'ci_lab_only_2026_DG!';
          GRANT SELECT ON TABLE dg_lab.lab_orders TO USER 'dg_ro'@'%';
          SQL
      - name: Verify real driver, role and denied-write constraints
        env:
          DATAGUARD_LIVE_STARROCKS: 'true'
          DATAGUARD_LIVE_STARROCKS_USER: dg_ro
          DATAGUARD_LIVE_STARROCKS_PASSWORD: ci_lab_only_2026_DG!
        run: mvn -B -ntp -pl dataguard-standalone -Dtest=StarRocksLiveJdbcTest test
      - name: Stop ONLY this CI laboratory container
        if: always()
        run: docker rm -f dg-v2-starrocks-ci || true
