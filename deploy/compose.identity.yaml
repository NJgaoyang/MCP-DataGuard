# Optional test-only OIDC service. Uses a persisted dev-file database, NOT production Keycloak.
# Supply random bootstrap credentials privately through deploy/.env.idp.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--http-enabled=true"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set_identity_admin_user}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set_identity_admin_password}
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: ${DG_PUBLIC_URL:?set_https_url}
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_APPEND: -Xms128m -Xmx640m
    volumes:
      - dg_identity_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:18081:8080"
volumes:
  dg_identity_data: {}
